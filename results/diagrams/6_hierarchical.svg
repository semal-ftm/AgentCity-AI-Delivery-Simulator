<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Nunito, Segoe UI, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4366"/></marker></defs>
<rect width="900" height="400" rx="18" fill="#fbfaf6"/>
<text x="24" y="34" font-size="19" font-weight="800" fill="#1d2340">Hierarchical Agent</text>
<text x="24" y="56" font-size="13" fill="#59617f">Goal decomposed into dependent subtasks</text>
<rect x="24" y="238" width="176" height="104" rx="14" fill="#eaf1ff" stroke="#5b7cfa" stroke-width="2"/>
<text x="112.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2340">Input / Perception</text>
<text x="112.0" y="284" text-anchor="middle" font-size="12" fill="#3b4366">Order, traffic feeds</text>
<text x="112.0" y="301" text-anchor="middle" font-size="12" fill="#3b4366">Weather</text>
<line x1="204" y1="290.0" x2="244" y2="290.0" stroke="#3b4366" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="250" y="238" width="176" height="104" rx="14" fill="#fff" stroke="#8e5cf7" stroke-width="2"/>
<text x="338.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2340">Decision process</text>
<text x="338.0" y="284" text-anchor="middle" font-size="12" fill="#3b4366">Scheduler runs ready tasks</text>
<text x="338.0" y="301" text-anchor="middle" font-size="12" fill="#3b4366">Select-route module decides</text>
<line x1="430" y1="290.0" x2="470" y2="290.0" stroke="#3b4366" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="476" y="238" width="176" height="104" rx="14" fill="#e7fbf3" stroke="#06a77d" stroke-width="2"/>
<text x="564.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2340">Action</text>
<text x="564.0" y="284" text-anchor="middle" font-size="12" fill="#3b4366">Pick up, ride, confirm</text>
<line x1="656" y1="290.0" x2="696" y2="290.0" stroke="#3b4366" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="702" y="238" width="176" height="104" rx="14" fill="#f2f4f8" stroke="#5b6b84" stroke-width="2"/>
<text x="790.0" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#1d2340">Environment</text>
<text x="790.0" y="284" text-anchor="middle" font-size="12" fill="#3b4366">City roads, traffic, weather</text>
<rect x="137.0" y="78" width="190" height="56" rx="14" fill="#ffffff" stroke="#e0a000" stroke-width="2"/>
<text x="232.0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#e0a000">Goal: deliver food</text>
<text x="232.0" y="124" text-anchor="middle" font-size="12" fill="#3b4366">subtasks 1-8 with dependencies</text>
<line x1="232.0" y1="136" x2="311.5" y2="232" stroke="#e0a000" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="349.0" y="78" width="190" height="74" rx="14" fill="#ffffff" stroke="#8e5cf7" stroke-width="2"/>
<text x="444.0" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#8e5cf7">Subtask modules</text>
<text x="444.0" y="124" text-anchor="middle" font-size="12" fill="#3b4366">accept → check → traffic | weather</text>
<text x="444.0" y="141" text-anchor="middle" font-size="12" fill="#3b4366">→ select → pick up → deliver → confirm</text>
<line x1="444.0" y1="154" x2="364.5" y2="232" stroke="#8e5cf7" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M790.0,346 L790.0,372 L112.0,372 L112.0,350" fill="none" stroke="#5b6b84" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="451.0" y="365" text-anchor="middle" font-size="12" fill="#59617f">feedback: task status updates</text>
</svg>